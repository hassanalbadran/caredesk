name: Android admin app

on:
  push:
    tags: ['android-v*']        # e.g. android-v0.1.0-beta.1
  workflow_dispatch:            # manual run: builds and uploads the APK as an artifact only

permissions:
  contents: write               # needed to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download open-source fonts
        run: ./scripts/fetch-fonts.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/android-v* ]]; then
            V="${GITHUB_REF#refs/tags/android-v}"
          else
            V="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Decode and verify keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # Tolerates CRLF / BOM / UTF-16 / double-base64 damage done by PowerShell (see scripts/decode-keystore.py)
          python3 scripts/decode-keystore.py "$RUNNER_TEMP/release.jks"
          # Fail here, with a readable message, instead of deep inside packageRelease
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > "$RUNNER_TEMP/kt.txt" 2>&1; then
            echo "::error::keytool cannot open the keystore: wrong KEYSTORE_PASSWORD / KEY_ALIAS, or the file is damaged"
            sed -e "s/$KEYSTORE_PASSWORD/***/g" "$RUNNER_TEMP/kt.txt" | head -5
            exit 1
          fi
          if [ "$(head -c4 "$RUNNER_TEMP/release.jks" | od -An -tx1 | tr -d " \n")" = "feedfeed" ]; then TYPE=jks; else TYPE=pkcs12; fi
          echo "keystore type: $TYPE"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_TYPE=$TYPE" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/CareDesk-Admin-${{ steps.ver.outputs.name }}.apk"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CareDesk-Admin-${{ steps.ver.outputs.name }}
          path: android/dist/*

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          name: CareDesk Admin (Android) ${{ steps.ver.outputs.name }}
          files: android/dist/*
          prerelease: ${{ contains(steps.ver.outputs.name, 'beta') || contains(steps.ver.outputs.name, 'dev') }}
          make_latest: 'false'   # keep the desktop app's "latest release" untouched
