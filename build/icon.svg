<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <!-- Gradients for Pocket & Folder -->
    <linearGradient id="bgFolderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222C37"/>
      <stop offset="100%" stop-color="#141B23"/>
    </linearGradient>

    <linearGradient id="frontPocketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#374351" stop-opacity="0.88"/>
      <stop offset="35%" stop-color="#1E2733" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#10161D" stop-opacity="0.99"/>
    </linearGradient>

    <linearGradient id="pocketRimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B8A9B" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#A5B4C4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7B8A9B" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Paper Gradients -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5E9EE"/>
    </linearGradient>

    <!-- Stopwatch Metallic Gradients -->
    <linearGradient id="metalBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64707D"/>
      <stop offset="45%" stop-color="#333C46"/>
      <stop offset="100%" stop-color="#181E24"/>
    </linearGradient>

    <linearGradient id="metalBezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B97A4"/>
      <stop offset="50%" stop-color="#434D59"/>
      <stop offset="100%" stop-color="#1D242B"/>
    </linearGradient>

    <radialGradient id="dialFaceGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#343D46"/>
      <stop offset="100%" stop-color="#1C2229"/>
    </radialGradient>

    <!-- Text Gradient -->
    <linearGradient id="textSilverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#DCE2E8"/>
      <stop offset="100%" stop-color="#AAB4BF"/>
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="mainDropShadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#0B121A" flood-opacity="0.32"/>
    </filter>

    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="pocketLipShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="-4" stdDeviation="6" flood-color="#0A0F14" flood-opacity="0.4"/>
    </filter>

    <!-- Clip Path for Front Pocket -->
    <clipPath id="pocketClip">
      <path d="M 205,375 
               L 355,375 
               C 385,375 405,428 500,428 
               C 595,428 615,375 645,375 
               L 795,375 
               L 795,675 
               C 795,745 745,795 675,795 
               L 325,795 
               C 255,795 205,745 205,675 Z"/>
    </clipPath>
  </defs>

  <!-- LAYER 1: BACK FOLDER BASE -->
  <g id="layer-back-folder" filter="url(#mainDropShadow)">
    <!-- Top Tab -->
    <path d="M 380,210 C 380,192 394,180 412,180 L 588,180 C 606,180 620,192 620,210 L 620,240 L 380,240 Z" fill="#E6EBEF"/>
    <!-- Main Dark Rounded Base -->
    <rect x="205" y="215" width="590" height="580" rx="120" ry="120" fill="url(#bgFolderGrad)"/>
  </g>

  <!-- LAYER 2: LEFT CHECKLIST DOCUMENT -->
  <g id="layer-left-document" transform="rotate(-7, 360, 400)" filter="url(#elementShadow)">
    <rect x="235" y="245" width="230" height="310" rx="16" ry="16" fill="url(#paperGrad)"/>
    <!-- Checklist Rows -->
    <g stroke="#8E99A4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Row 1 (Checked) -->
      <rect x="262" y="275" width="22" height="22" rx="4"/>
      <polyline points="267,286 272,292 281,280" stroke="#3B4652" stroke-width="3.2"/>
      <line x1="298" y1="286" x2="365" y2="286" stroke="#A6B0BA" stroke-width="3.5"/>

      <!-- Row 2 -->
      <rect x="262" y="312" width="22" height="22" rx="4"/>
      <line x1="298" y1="323" x2="365" y2="323" stroke="#A6B0BA" stroke-width="3.5"/>

      <!-- Row 3 -->
      <rect x="262" y="349" width="22" height="22" rx="4"/>
      <line x1="298" y1="360" x2="365" y2="360" stroke="#A6B0BA" stroke-width="3.5"/>

      <!-- Row 4 -->
      <rect x="262" y="386" width="22" height="22" rx="4"/>
      <line x1="298" y1="397" x2="365" y2="397" stroke="#A6B0BA" stroke-width="3.5"/>

      <!-- Row 5 -->
      <rect x="262" y="423" width="22" height="22" rx="4"/>
      <line x1="298" y1="434" x2="365" y2="434" stroke="#A6B0BA" stroke-width="3.5"/>

      <!-- Row 6 -->
      <rect x="262" y="460" width="22" height="22" rx="4"/>
      <line x1="298" y1="471" x2="365" y2="471" stroke="#A6B0BA" stroke-width="3.5"/>
    </g>
  </g>

  <!-- LAYER 3: RIGHT SCHEDULE / GRID DOCUMENT -->
  <g id="layer-right-document" transform="rotate(7, 640, 400)" filter="url(#elementShadow)">
    <rect x="535" y="245" width="230" height="310" rx="16" ry="16" fill="url(#paperGrad)"/>
    <!-- Grid Lines -->
    <g stroke="#B8C1CA" stroke-width="2.2">
      <!-- Horizontal -->
      <line x1="595" y1="285" x2="742" y2="285"/>
      <line x1="595" y1="325" x2="742" y2="325"/>
      <line x1="595" y1="365" x2="742" y2="365"/>
      <line x1="595" y1="405" x2="742" y2="405"/>
      <line x1="595" y1="445" x2="742" y2="445"/>
      <line x1="595" y1="485" x2="742" y2="485"/>
      <!-- Vertical -->
      <line x1="620" y1="265" x2="620" y2="505"/>
      <line x1="660" y1="265" x2="660" y2="505"/>
      <line x1="700" y1="265" x2="700" y2="505"/>
      <line x1="740" y1="265" x2="740" y2="505"/>
    </g>
    <!-- Checkmarks & Plus Icons -->
    <g stroke="#4B5663" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Check 1 -->
      <polyline points="632,306 638,312 648,300"/>
      <!-- Plus Col 3 Row 2 -->
      <line x1="720" y1="300" x2="720" y2="314"/><line x1="713" y1="307" x2="727" y2="307"/>
      <!-- Plus Col 3 Row 3 -->
      <line x1="720" y1="340" x2="720" y2="354"/><line x1="713" y1="347" x2="727" y2="347"/>
      <!-- Plus Col 2 Row 4 -->
      <line x1="680" y1="380" x2="680" y2="394"/><line x1="673" y1="387" x2="687" y2="387"/>
      <!-- Plus Col 3 Row 4 -->
      <line x1="720" y1="380" x2="720" y2="394"/><line x1="713" y1="387" x2="727" y2="387"/>
      <!-- Check 2 -->
      <polyline points="632,426 638,432 648,420"/>
      <!-- Plus Col 3 Row 5 -->
      <line x1="720" y1="420" x2="720" y2="434"/><line x1="713" y1="427" x2="727" y2="427"/>
    </g>
  </g>

  <!-- LAYER 4: STOPWATCH -->
  <g id="layer-stopwatch" filter="url(#elementShadow)">
    <!-- Top Ring -->
    <circle cx="500" cy="182" r="34" fill="none" stroke="url(#metalBezelGrad)" stroke-width="9"/>
    <!-- Top Crown & Stem -->
    <rect x="491" y="206" width="18" height="22" fill="url(#metalBodyGrad)"/>
    <rect x="482" y="196" width="36" height="14" rx="4" fill="url(#metalBezelGrad)"/>

    <!-- Left Pusher -->
    <g transform="rotate(-34, 500, 365)">
      <rect x="492" y="205" width="16" height="22" fill="url(#metalBodyGrad)"/>
      <rect x="484" y="193" width="32" height="14" rx="4" fill="url(#metalBezelGrad)"/>
    </g>

    <!-- Right Pusher -->
    <g transform="rotate(34, 500, 365)">
      <rect x="492" y="205" width="16" height="22" fill="url(#metalBodyGrad)"/>
      <rect x="484" y="193" width="32" height="14" rx="4" fill="url(#metalBezelGrad)"/>
    </g>

    <!-- Outer Case -->
    <circle cx="500" cy="365" r="142" fill="url(#metalBodyGrad)"/>
    <!-- Metallic Bezel Ring -->
    <circle cx="500" cy="365" r="130" fill="none" stroke="url(#metalBezelGrad)" stroke-width="12"/>
    <!-- Inner Dial Face -->
    <circle cx="500" cy="365" r="120" fill="url(#dialFaceGrad)"/>

    <!-- Main Dial Ticks (60 ticks generated cleanly) -->
    <g id="stopwatch-ticks" stroke="#D2DAE2" stroke-linecap="round">
      <!-- 12 Major Ticks (every 30 deg) -->
      <line x1="500" y1="252" x2="500" y2="268" stroke-width="3" transform="rotate(0, 500, 365)"/>
      <line x1="500" y1="252" x2="500" y2="268" stroke-width="3" transform="rotate(30, 500, 365)"/>
      <line x1="500" y1="252" x2="500" y2="268" stroke-width="3" transform="rotate(60, 500, 365)"/>
      <line x1="500" y1="252" x2="500" y2="268" stroke-width="3" transform="rotate(90, 500, 365)"/>
      <line x1="500" y1="252" x2="500" y2="268" stroke-width="3" transform="rotate(120, 500, 365)"/>
      <line x1="500" y1="252" x2="500" y2="268" stroke-width="3" transform="rotate(150, 500, 365)"/>
      <line x1="500" y1="252" x2="500" y2="268" stroke-width="3" transform="rotate(180, 500, 365)"/>
      <line x1="500" y1="252" x2="500" y2="268" stroke-width="3" transform="rotate(210, 500, 365)"/>
      <line x1="500" y1="252" x2="500" y2="268" stroke-width="3" transform="rotate(240, 500, 365)"/>
      <line x1="500" y1="252" x2="500" y2="268" stroke-width="3" transform="rotate(270, 500, 365)"/>
      <line x1="500" y1="252" x2="500" y2="268" stroke-width="3" transform="rotate(300, 500, 365)"/>
      <line x1="500" y1="252" x2="500" y2="268" stroke-width="3" transform="rotate(330, 500, 365)"/>

      <!-- Intermediate Ticks -->
      <g stroke-width="1.6" stroke="#9AA5B1">
        <line x1="500" y1="254" x2="500" y2="264" transform="rotate(10, 500, 365)"/>
        <line x1="500" y1="254" x2="500" y2="264" transform="rotate(20, 500, 365)"/>
        <line x1="500" y1="254" x2="500" y2="264" transform="rotate(40, 500, 365)"/>
        <line x1="500" y1="254" x2="500" y2="264" transform="rotate(50, 500, 365)"/>
        <line x1="500" y1="254" x2="500" y2="264" transform="rotate(70, 500, 365)"/>
        <line x1="500" y1="254" x2="500" y2="264" transform="rotate(80, 500, 365)"/>
        <line x1="500" y1="254" x2="500" y2="264" transform="rotate(100, 500, 365)"/>
        <line x1="500" y1="254" x2="500" y2="264" transform="rotate(110, 500, 365)"/>
        <line x1="500" y1="254" x2="500" y2="264" transform="rotate(130, 500, 365)"/>
        <line x1="500" y1="254" x2="500" y2="264" transform="rotate(140, 500, 365)"/>
        <line x1="500" y1="254" x2="500" y2="264" transform="rotate(160, 500, 365)"/>
        <line x1="500" y1="254" x2="500" y2="264" transform="rotate(170, 500, 365)"/>
        <line x1="500" y1="254" x2="500" y2="264" transform="rotate(190, 500, 365)"/>
        <line x1="500" y1="254" x2="500" y2="264" transform="rotate(200, 500, 365)"/>
        <line x1="500" y1="254" x2="500" y2="264" transform="rotate(220, 500, 365)"/>
        <line x1="500" y1="254" x2="500" y2="264" transform="rotate(230, 500, 365)"/>
        <line x1="500" y1="254" x2="500" y2="264" transform="rotate(250, 500, 365)"/>
        <line x1="500" y1="254" x2="500" y2="264" transform="rotate(260, 500, 365)"/>
        <line x1="500" y1="254" x2="500" y2="264" transform="rotate(280, 500, 365)"/>
        <line x1="500" y1="254" x2="500" y2="264" transform="rotate(290, 500, 365)"/>
        <line x1="500" y1="254" x2="500" y2="264" transform="rotate(310, 500, 365)"/>
        <line x1="500" y1="254" x2="500" y2="264" transform="rotate(320, 500, 365)"/>
        <line x1="500" y1="254" x2="500" y2="264" transform="rotate(340, 500, 365)"/>
        <line x1="500" y1="254" x2="500" y2="264" transform="rotate(350, 500, 365)"/>
      </g>
    </g>

    <!-- Sub-Dial (Top Center) -->
    <circle cx="500" cy="312" r="28" fill="#181E24" stroke="#788490" stroke-width="2"/>
    <circle cx="500" cy="312" r="24" fill="none" stroke="#B8C2CC" stroke-width="2" stroke-dasharray="1.5 4.78"/>
    <line x1="500" y1="312" x2="500" y2="292" stroke="#E2E8F0" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="500" cy="312" r="4" fill="#E2E8F0"/>

    <!-- Clock Hands -->
    <!-- Hour Hand -->
    <line x1="500" y1="365" x2="435" y2="345" stroke="#CBD5E1" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Minute Hand -->
    <line x1="500" y1="365" x2="555" y2="305" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round"/>
    <!-- Second Hand -->
    <line x1="485" y1="382" x2="555" y2="392" stroke="#94A3B8" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Center Pin -->
    <circle cx="500" cy="365" r="8" fill="#E2E8F0"/>
    <circle cx="500" cy="365" r="3.5" fill="#1E2733"/>
  </g>

  <!-- LAYER 5: FRONT TRANSLUCENT POCKET -->
  <g id="layer-front-pocket" filter="url(#pocketLipShadow)">
    <!-- Main Pocket Body -->
    <path d="M 205,375 
             L 355,375 
             C 385,375 405,428 500,428 
             C 595,428 615,375 645,375 
             L 795,375 
             L 795,675 
             C 795,745 745,795 675,795 
             L 325,795 
             C 255,795 205,745 205,675 Z" 
          fill="url(#frontPocketGrad)"/>

    <!-- Top Glass Edge Rim Highlight -->
    <path d="M 205,375 
             L 355,375 
             C 385,375 405,428 500,428 
             C 595,428 615,375 645,375 
             L 795,375" 
          fill="none" stroke="url(#pocketRimGrad)" stroke-width="3"/>
  </g>

  <!-- LAYER 6: EDITABLE BRAND TEXT -->
  <g id="layer-brand-text">
    <text x="500" y="610" 
          font-family="Georgia, 'Times New Roman', 'Playfair Display', serif" 
          font-size="112" 
          font-weight="500" 
          letter-spacing="-1.5"
          text-anchor="middle" 
          fill="url(#textSilverGrad)">CareDesk</text>
  </g>
</svg>